name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-workspace:
    name: Rust workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Rustfmt
        run: cargo +1.98.0 fmt --all -- --check

      - name: Clippy
        run: cargo +1.98.0 clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo +1.98.0 test --locked --workspace --all-features

      - name: Build
        run: cargo +1.98.0 build --locked --workspace --all-targets

      - name: Release build
        run: cargo +1.98.0 build --locked --workspace --release --all-targets

      - name: Single-binary serve smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          data="$(mktemp -d)"
          ./target/release/cool serve --data-dir "$data" --port 18081 >/tmp/cool-serve.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18081/api/health >/dev/null; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              cat /tmp/cool-serve.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18081/api/health | grep '"status":"ok"'

      - name: Generated schema, TypeScript and golden traces are current
        run: cargo +1.98.0 run --locked -p cool-protocol --bin generate -- --check

      - name: Set up Node.js for generated SDK sample
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install TypeScript toolchain
        working-directory: frontend
        run: npm ci

      - name: Type-check and run TypeScript App Server sample
        shell: bash
        run: |
          ./frontend/node_modules/.bin/tsc -p sdk/typescript/tsconfig.json
          node sdk/typescript/dist/sample-client.js

      - name: Upload Unix release binary
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: cool-${{ runner.os }}-${{ runner.arch }}
          path: target/release/cool

      - name: Upload Windows release binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: cool-${{ runner.os }}-${{ runner.arch }}
          path: target/release/cool.exe

  rust-security:
    name: Rust dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit licenses, advisories, sources and bans
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  rust-m0-spike:
    name: Rust M0 spike (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: spikes/m0-rust-core
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Rustfmt
        run: cargo +1.98.0 fmt --all -- --check

      - name: Clippy
        run: cargo +1.98.0 clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo +1.98.0 test --locked --all-features

      - name: Build
        run: cargo +1.98.0 build --locked --all-targets

  backend:
    name: Backend (ruff + mypy + pytest + evals)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          pip install pytest-github-actions-annotate-failures

      - name: Ruff check
        working-directory: backend
        run: ruff check .

      - name: Mypy
        working-directory: backend
        run: mypy app

      - name: Pytest
        working-directory: backend
        run: pytest --tb=short -q -n auto --dist=loadfile

      - name: Deterministic eval gate
        working-directory: backend
        run: python -m evals

  store-parity:
    name: Store parity (Rust legacy store vs Python schema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Cross-language store contract tests
        working-directory: backend
        run: pytest tests/test_rust_store_contract.py -q --tb=short

  frontend:
    name: Frontend (oxlint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Oxlint
        working-directory: frontend
        run: npm run lint

      - name: Canonical protocol replay
        working-directory: frontend
        run: npm run protocol:check

      - name: TypeScript + Vite build
        working-directory: frontend
        run: npm run build

  package:
    name: Rust release image smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Rust + React release image
        run: docker build --tag cool-ai-harness:ci .

      - name: Smoke one-port UI, API and canonical SSE
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker logs cool-package-smoke || true
            docker rm --force cool-package-smoke || true
          }
          trap cleanup EXIT
          docker run --detach --name cool-package-smoke \
            --publish 127.0.0.1:18000:8000 \
            --env COOL_API_TOKEN=ci-only-api-token-123456 \
            cool-ai-harness:ci
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:18000/api/health >/dev/null; then
              break
            fi
            if [ "$attempt" = 90 ]; then
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18000/api/health | grep '"status":"ok"'
          curl --fail --silent http://127.0.0.1:18000/ | grep '<div id="root"></div>'
          test "$(docker exec cool-package-smoke id --user)" = "10001"
          docker exec cool-package-smoke git --version
          # The runtime image carries neither Python nor Node.
          docker exec cool-package-smoke sh -c 'command -v python3 >/dev/null && exit 1 || true'
          docker exec cool-package-smoke sh -c 'command -v node >/dev/null && exit 1 || true'

          # Mint the client-identity cookie (anonymous SSE is refused), then drive
          # the canonical App Protocol over POST /api/rpc.
          curl --fail --silent --cookie-jar /tmp/cool-cookies.txt \
            http://127.0.0.1:18000/api/health >/dev/null
          rpc() {
            curl --fail --silent --show-error \
              --header 'Content-Type: application/json' \
              --header 'Authorization: Bearer ci-only-api-token-123456' \
              --cookie-jar /tmp/cool-cookies.txt --cookie /tmp/cool-cookies.txt \
              --data "$1" \
              http://127.0.0.1:18000/api/rpc
          }
          rpc '{"jsonrpc":"2.0","id":1,"method":"cool.command","params":{"protocolVersion":1,"commandId":"smoke-init","command":{"method":"initialize","params":{"clientName":"ci-smoke","clientVersion":"1","supportedProtocolVersions":[1],"capabilities":[]}}}}' >/dev/null
          session_id="$(rpc '{"jsonrpc":"2.0","id":2,"method":"cool.command","params":{"protocolVersion":1,"commandId":"smoke-session","command":{"method":"session.create","params":{"idempotencyKey":"smoke-session","title":"image smoke","projectKey":null}}}}' | python3 -c 'import json, sys; print(json.load(sys.stdin)["result"]["value"]["sessionId"])')"
          run_id="$(rpc "{\"jsonrpc\":\"2.0\",\"id\":3,\"method\":\"cool.command\",\"params\":{\"protocolVersion\":1,\"commandId\":\"smoke-prompt\",\"command\":{\"method\":\"session.prompt\",\"params\":{\"idempotencyKey\":\"smoke-prompt\",\"sessionId\":\"${session_id}\",\"content\":[{\"type\":\"text\",\"text\":\"transport smoke\"}],\"model\":null,\"planMode\":false,\"systemPrompt\":null}}}}" | python3 -c 'import json, sys; print(json.load(sys.stdin)["result"]["value"]["runId"])')"

          curl --fail --silent --show-error --max-time 30 \
            --header 'Authorization: Bearer ci-only-api-token-123456' \
            --cookie /tmp/cool-cookies.txt \
            "http://127.0.0.1:18000/api/events?runId=${run_id}&afterSeq=0&limit=64" \
            > /tmp/cool-sse-smoke.txt
          grep -q 'event: run.event' /tmp/cool-sse-smoke.txt
          grep -q 'run.completed' /tmp/cool-sse-smoke.txt
          grep -q 'event: end' /tmp/cool-sse-smoke.txt
