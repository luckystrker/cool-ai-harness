name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-protocol:
    name: Rust protocol (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Rustfmt
        run: cargo +1.98.0 fmt --all -- --check

      - name: Clippy
        run: cargo +1.98.0 clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo +1.98.0 test --workspace --all-features

      - name: Build
        run: cargo +1.98.0 build --workspace --all-targets

      - name: Generated schema, TypeScript and golden traces are current
        run: cargo +1.98.0 run -p cool-protocol --bin generate -- --check

  rust-m0-spike:
    name: Rust M0 spike (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: spikes/m0-rust-core
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Rustfmt
        run: cargo +1.98.0 fmt --all -- --check

      - name: Clippy
        run: cargo +1.98.0 clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo +1.98.0 test --all-features

      - name: Build
        run: cargo +1.98.0 build --all-targets

  backend:
    name: Backend (ruff + mypy + pytest + evals)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          pip install pytest-github-actions-annotate-failures

      - name: Ruff check
        working-directory: backend
        run: ruff check .

      - name: Mypy
        working-directory: backend
        run: mypy app

      - name: Pytest
        working-directory: backend
        run: pytest --tb=short -q -n auto --dist=loadfile

      - name: Deterministic eval gate
        working-directory: backend
        run: python -m evals

  frontend:
    name: Frontend (oxlint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Oxlint
        working-directory: frontend
        run: npm run lint

      - name: Canonical protocol replay
        working-directory: frontend
        run: npm run protocol:check

      - name: TypeScript + Vite build
        working-directory: frontend
        run: npm run build

  package:
    name: Unified release image smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build React + backend release image
        run: docker build --tag cool-ai-harness:ci .

      - name: Smoke one-port UI and API
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker logs cool-package-smoke || true
            docker rm --force cool-package-smoke || true
          }
          trap cleanup EXIT
          docker run --detach --name cool-package-smoke \
            --publish 127.0.0.1:18000:8000 \
            --env SECRET_KEY=ci-only-secret-key \
            cool-ai-harness:ci
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18000/api/health >/dev/null; then
              break
            fi
            if [ "$attempt" = 60 ]; then
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18000/api/health | grep '"status":"ok"'
          curl --fail --silent http://127.0.0.1:18000/ | grep '<div id="root"></div>'
          test "$(docker exec cool-package-smoke id --user)" = "10001"
          docker exec cool-package-smoke git --version
          docker exec cool-package-smoke sh -c \
            'repository="$(mktemp -d)"; git -C "$repository" init --quiet; git -C "$repository" status --short'
          docker exec cool-package-smoke python -c \
            "from app.skills.registry import SkillRegistry; names = [s.name for s in SkillRegistry().list_all()]; expected = ['brainstorm', 'code-task', 'deep-research', 'skill-creation', 'summarize-document', 'translate']; assert names == expected, names"

          conversation_id="$(curl --fail --silent \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"title":"image transport smoke","model":"smoke-model"}' \
            http://127.0.0.1:18000/api/conversations \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])')"

          curl --fail --silent --show-error --max-time 20 \
            --request POST \
            --header 'Content-Type: application/json' \
            --header 'Accept: text/event-stream' \
            --data '{"content":"transport smoke"}' \
            "http://127.0.0.1:18000/api/conversations/${conversation_id}/messages" \
            > /tmp/cool-sse-smoke.txt
          python3 -c 'import json, pathlib; events = [json.loads(line[5:].strip()) for line in pathlib.Path("/tmp/cool-sse-smoke.txt").read_text().splitlines() if line.startswith("data:")]; assert any(event.get("kind") == "error" for event in events), events'

          docker exec --env CONVERSATION_ID="$conversation_id" cool-package-smoke \
            python -c 'import asyncio, json, os, websockets
          async def smoke():
              async with asyncio.timeout(10):
                  conversation_id = os.environ["CONVERSATION_ID"]
                  uri = f"ws://127.0.0.1:8000/ws/chat/{conversation_id}"
                  async with websockets.connect(uri) as socket:
                      await socket.send(json.dumps({"invalid": True}))
                      event = json.loads(await socket.recv())
                      assert event["kind"] == "error", event
          asyncio.run(smoke())'
