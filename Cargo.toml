[workspace]
members = ["crates/cool-app-server", "crates/cool-cli", "crates/cool-protocol"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.98"
version = "0.1.0"

[workspace.dependencies]
schemars = "=1.2.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
ts-rs = { version = "=12.0.1", features = ["serde-compat", "serde-json-impl"] }
uuid = { version = "=1.24.1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
