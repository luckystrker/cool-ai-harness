[workspace]
members = [
    "crates/cool-agent",
    "crates/cool-app-server",
    "crates/cool-cli",
    "crates/cool-core",
    "crates/cool-extensions",
    "crates/cool-protocol",
    "crates/cool-security",
    "crates/cool-state",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.98"
version = "0.1.0"

[workspace.dependencies]
async-trait = "=0.1.92"
base64 = "=0.23.1"
fernet = { version = "=0.2.2", default-features = false, features = ["rustcrypto"] }
futures-util = "=0.3.34"
regex = "=1.13.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
schemars = "=1.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
ts-rs = { version = "=12.0.1", features = ["serde-compat", "serde-json-impl"] }
url = "=2.5.8"
uuid = { version = "=1.26.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
