[workspace]
members = ["crates/cool-protocol"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.98"
version = "0.1.0"

[workspace.dependencies]
schemars = "=1.2.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
ts-rs = { version = "=12.0.1", features = ["serde-compat", "serde-json-impl"] }

[workspace.lints.rust]
unsafe_code = "forbid"
