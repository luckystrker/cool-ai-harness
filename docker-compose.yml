services:
  cool:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cool
    ports:
      # Loopback-only by default: the host publishes the single cool port.
      - "127.0.0.1:${COOL_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    # One persisted data root holds both SQLite stores and plugin state. The
    # image entrypoint binds 0.0.0.0 inside the container namespace, so the
    # local profile requires COOL_API_TOKEN (provide it in .env) and fails
    # closed without it. The entrypoint serves the legacy families and
    # initializes a fresh baseline store on first run.
    environment:
      COOL_DATA_DIR: /var/lib/cool
    volumes:
      - cool-state:/var/lib/cool
    restart: unless-stopped

volumes:
  cool-state:
