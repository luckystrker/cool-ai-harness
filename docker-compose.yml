services:
  cool:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cool
    ports:
      - "127.0.0.1:${COOL_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    # Keep every mutable path inside the single persisted cool-state volume.
    # Path overrides from .env are intentionally source/direct-image settings.
    environment:
      COOL_HOME: /var/lib/cool
      COOL_CONFIG_FILE: /var/lib/cool/config.yaml
      DATA_DIR: /var/lib/cool/data
      WORKSPACES_DIR: /var/lib/cool/workspaces
      SKILLS_DIR: /var/lib/cool/skills
      ARTIFACTS_DIR: /var/lib/cool/data/artifacts
      FRONTEND_DIST: /opt/cool/frontend/dist
      ENVIRONMENT: production
      DEBUG: "false"
    volumes:
      - cool-state:/var/lib/cool
    restart: unless-stopped
    command: ["cool", "serve", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  cool-state:
